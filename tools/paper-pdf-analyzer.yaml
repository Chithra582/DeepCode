name: paper-pdf-analyzer
description: Segments scientific research papers into formal mathematical equations,
  algorithms, and architecture specs.
input_schema:
  type: object
  properties:
    pdf_path:
      type: string
      description: Path to the research paper PDF file.
    extract_equations:
      type: boolean
      description: Whether to extract mathematical formulas into LaTeX.
  required:
  - pdf_path
